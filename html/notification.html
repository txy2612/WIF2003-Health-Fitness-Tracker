<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Notifications</title>

    <link href="../vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap"
        rel="stylesheet">
    <link href="../css/sb-admin-2.min.css" rel="stylesheet">
    <link href="../css/notification.css" rel="stylesheet">
    <link href="../css/shared.css" rel="stylesheet">

</head>

<body id="page-top">

    <div id="wrapper">

        <!-- SIDEBAR (injected by layout.js) -->
        <div id="sidebar-placeholder"></div>

        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">

                <!-- TOPBAR (injected by layout.js) -->
                <div id="topbar-placeholder"></div>

                <!-- Begin Page Content -->
                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <h1 class="h3 mb-1 text-gray-800">Notifications</h1>
                    <p class="mb-4 text-muted">Manage your reminders and stay on track.</p>

                    <!-- ===== ROW: ADD + LIST SIDE BY SIDE ===== -->
                    <div class="row justify-content-center">

                        <!-- ADD REMINDER -->
                        <div class="col-lg-5 mb-4">
                            <div class="card shadow h-100">

                                <div class="card-header py-3 d-flex align-items-center">
                                    <i class="fas fa-bell text-primary mr-2"></i>
                                    <div>
                                        <h6 class="m-0 font-weight-bold text-primary">Add Reminder</h6>
                                        <small class="text-muted">Create a reminder</small>
                                    </div>
                                </div>

                                <div class="card-body">
                                    <form id="reminderForm">

                                        <div class="row">

                                            <!-- REMINDER TYPE -->
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <label>
                                                        <i class="fas fa-list fa-sm text-gray-500 mr-1"></i> Reminder
                                                        Type
                                                    </label>
                                                    <select class="form-control" id="type">
                                                        <option disabled selected>Select reminder type...</option>
                                                        <option>🏃 Running</option>
                                                        <option>🚴 Cycling</option>
                                                        <option>🏊 Swimming</option>
                                                        <option>🏋️ Weight Training</option>
                                                        <option>🧘 Yoga</option>
                                                        <option>🚶 Walking</option>
                                                        <option>⚽ Football / Soccer</option>
                                                        <option>🏸 Badminton</option>
                                                        <option>Other</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <!-- DATE -->
                                            <div class="col-md-6">
                                                <div class="form-group">
                                                    <label>Date</label>
                                                    <input type="date" id="date" class="form-control" required>
                                                </div>
                                            </div>

                                            <!-- TIME -->
                                            <div class="col-md-6">
                                                <div class="form-group">
                                                    <label>Time</label>
                                                    <input type="time" id="time" class="form-control" required>
                                                </div>
                                            </div>

                                            <!-- NOTE -->
                                            <div class="col-12">
                                                <div class="form-group">
                                                    <label>Note (optional)</label>
                                                    <textarea id="note" class="form-control" rows="2"></textarea>
                                                </div>
                                            </div>

                                        </div>

                                        <div class="text-right">
                                            <button class="btn btn-primary" type="submit">
                                                <i class="fas fa-plus mr-1"></i> Add Reminder
                                            </button>
                                        </div>

                                    </form>
                                </div>

                            </div>
                        </div>

                        <!-- REMINDER LIST -->
                        <div class="col-lg-5 mb-4">
                            <div class="card shadow h-100">

                                <div class="card-header py-3 d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="m-0 font-weight-bold text-primary">Reminder List</h6>
                                        <small class="text-muted">Manage your reminders</small>
                                    </div>
                                    <span class="badge badge-primary" id="count">0</span>
                                </div>

                                <div class="card-body">

                                    <!-- EMPTY STATE -->
                                    <div id="emptyState" class="text-center py-4">
                                        <i class="fas fa-bell-slash fa-2x text-gray-300 mb-2"></i>
                                        <p class="text-muted mb-0">No reminders yet</p>
                                    </div>

                                    <!-- LIST -->
                                    <ul id="reminderList" class="list-group"></ul>

                                </div>

                            </div>
                        </div>

                    </div>

                    <!-- ===== FEEDBACK / INSIGHTS ===== -->
                    <div class="row justify-content-center">
                        <div class="col-lg-10">
                            <div class="card shadow mb-4">

                                <div class="card-header py-3 d-flex align-items-center">
                                    <i class="fas fa-lightbulb text-primary mr-2"></i>
                                    <div>
                                        <h6 class="m-0 font-weight-bold text-primary">Feedback / Insights</h6>
                                        <small class="text-muted style=1.2rem">Smart suggestions based on your activity</small>
                                    </div>
                                </div>

                                <div>
                                    <ul class="list-group" id="insightsList">
                                    </ul>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
                <!-- /.container-fluid -->

            </div>

            <!-- FOOTER (injected by layout.js) -->
            <div id="footer-placeholder"></div>

            <div class="modal fade" id="deleteModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered modal-sm">
                    <div class="modal-content">
                        <div class="modal-body text-center py-4">
                            <i class="fas fa-trash-alt fa-3x text-danger mb-3"></i>
                            <h6 class="font-weight-bold mb-1">Delete Reminder?</h6>
                            <p class="text-muted small mb-3">This action cannot be undone.</p>
                            <button class="btn btn-danger btn-sm mr-2" id="confirmDeleteBtn">
                                <i class="fas fa-trash mr-1"></i> Delete
                            </button>
                            <button class="btn btn-outline-secondary btn-sm" data-dismiss="modal">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- SCROLL TO TOP + LOGOUT MODAL (injected by layout.js) -->
    <div id="extras-placeholder"></div>

    <script src="../vendor/jquery/jquery.min.js"></script>
    <script src="../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="../js/sb-admin-2.min.js"></script>

    <!-- layout.js before page scripts -->
    <script src="../js/layout.js"></script>
    <script src="../js/fitness.js"></script>
    <script src="../js/insights.js"></script>
    <script src="../js/notification.js"></script>

</body>

</html>
